name: typst-editor

# Stable: follows the newest published release tag (`latest`). Update: `docker compose pull && docker compose up -d`.
# Variants: compose.dev.yml (rolling :main builds) · compose.pinned.yml (exact version) · compose.hardened.yml (sandbox overlay) · compose.prerelease.yml (local build).
services:
  typst-editor:
    image: ghcr.io/fl-grtg/typst-editor:latest
    container_name: typst-editor
    restart: unless-stopped
    env_file: [{path: .env, required: false}]
    volumes:
      - ${COMPOSE_DATA_PATH:-typst-data}:/app/data
    ports:
      - "127.0.0.1:${PORT:-8978}:${PORT:-8978}" # PORT from .env (default 8978); LAN bind: replace 127.0.0.1 with your host IP

volumes:
  typst-data:
