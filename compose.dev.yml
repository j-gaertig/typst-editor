name: typst-editor

# Dev: tracks the rolling :main branch builds — every `docker compose up -d` pulls the newest build.
# Not for stable setups: main can contain unreleased changes (see RELEASE_NOTES.md).
services:
  typst-editor:
    image: ghcr.io/fl-grtg/typst-editor:main
    pull_policy: always
    container_name: typst-editor
    restart: unless-stopped
    env_file: [{path: .env, required: false}]
    volumes:
      - ${COMPOSE_DATA_PATH:-typst-data}:/app/data
    ports:
      - "127.0.0.1:${PORT:-8978}:${PORT:-8978}" # PORT from .env (default 8978); LAN bind: replace 127.0.0.1 with your host IP

volumes:
  typst-data:
